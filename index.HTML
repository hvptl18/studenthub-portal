<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudentHub - Login</title>

    <!-- Connect CSS file -->
    <link rel="stylesheet" href="css/style.css">

</head>


<body>

    <!-- Login Container -->
    <div class="login-container">

        <!-- Login Box -->
        <div class="login-box">

            <!-- Logo / Website Name -->
            <h1>StudentHub</h1>

            <p class="login-subtitle">
                Your Campus. Your Community. Your Hub.
            </p>


            <!-- Username -->
            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                placeholder="Enter your username"
            >


            <!-- Password -->
            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
            >


            <!-- Login Button -->
            <button
                class="button login-button"
                onclick="loginUser()"
            >
                Login
            </button>


            <!-- Demo Information -->
            <p class="demo-text">
                Demo: Enter any username and password
            </p>

        </div>

    </div>


    <!-- Connect JavaScript file -->
    <script src="js/scrippt.js"></script>

</body>

</html>

<!DOCTYPE html>

</head>

<body>

<header>

<div class="logo">
<h1>🎓 StudentHub</h1>
</div>

<nav>

<ul>

<li><a href="index.html">Home</a></li>
<li><a href="feedback.html" class="active">Feedback</a></li>

</ul>

</nav>

</header>

<main>

<div class="form-container">

<h2>Feedback Form</h2>

<form>

<label>Full Name</label>
<input type="text" placeholder="Enter your name" required>

<label>Email</label>
<input type="email" placeholder="Enter your email" required>

<label>Rating</label>

<select>

<option>⭐⭐⭐⭐⭐ Excellent</option>
<option>⭐⭐⭐⭐ Good</option>
<option>⭐⭐⭐ Average</option>
<option>⭐⭐ Poor</option>
<option>⭐ Very Poor</option>

</select>

<label>Suggestions</label>

<textarea rows="5" placeholder="Write your suggestions"></textarea>

<button type="submit">

Submit Feedback

</button>

</form>

</div>

</main>

<footer>

<p class="copyright">

© 2026 StudentHub

</p>

</footer>

</body>
</html>

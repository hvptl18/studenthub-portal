<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>StudentHub Registration</title>
  <link rel="stylesheet" href="style1.css">
</head>
<body>
  <div class="container">
    <h2>Student Registration Form</h2>
    <form id="registrationForm" novalidate>
      
      <!-- Full Name -->
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" required>
      <small class="error" id="nameError"></small>

      <!-- Email -->
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>
      <small class="error" id="emailError"></small>

      <!-- Mobile -->
      <label for="mobile">Mobile Number</label>
      <input type="tel" id="mobile" name="mobile" required>
      <small class="error" id="mobileError"></small>

      <!-- Password -->
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>
      <meter max="4" id="passwordStrength"></meter>
      <small class="error" id="passwordError"></small>

      <!-- Confirm Password -->
      <label for="confirmPassword">Confirm Password</label>
      <input type="password" id="confirmPassword" name="confirmPassword" required>
      <small class="error" id="confirmPasswordError"></small>

      <!-- Course -->
      <label for="course">Course</label>
      <select id="course" name="course" required>
        <option value="">Select Course</option>
        <option value="B.Tech">B.Tech</option>
        <option value="M.Tech">M.Tech</option>
        <option value="MBA">MBA</option>
      </select>
      <small class="error" id="courseError"></small>

      <!-- Year -->
      <label for="year">Year</label>
      <select id="year" name="year" required>
        <option value="">Select Year</option>
        <option value="1">1st Year</option>
        <option value="2">2nd Year</option>
        <option value="3">3rd Year</option>
        <option value="4">4th Year</option>
      </select>
      <small class="error" id="yearError"></small>

      <!-- Gender -->
      <fieldset>
        <legend>Gender</legend>
        <label><input type="radio" name="gender" value="Male" required> Male</label>
        <label><input type="radio" name="gender" value="Female"> Female</label>
        <label><input type="radio" name="gender" value="Other"> Other</label>
      </fieldset>
      <small class="error" id="genderError"></small>

      <!-- Terms -->
      <label>
        <input type="checkbox" id="terms" required> I accept the terms & conditions
      </label>
      <small class="error" id="termsError"></small>

      <!-- Submit -->
      <button type="submit">Register</button>
    </form>
  </div>
  <script src="script.js"></script>
</body>
</html>
